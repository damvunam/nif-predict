project:
  name: "NifPredict"
  version: "0.1.0"
  description: "Nền tảng sinh học tính toán dự đoán khả năng cố định đạm"

paths:
  raw_zip_dir: "data/raw/zip_archives"
  raw_genomes_dir: "data/raw/genomes"
  raw_metadata_dir: "data/raw/metadata"
  annotation_dir: "data/interim/annotations"
  processed_dir: "data/processed"
  log_dir: "logs"

ncbi:
  api_base_url: "https://api.ncbi.nlm.nih.gov/datasets/v2alpha"
  timeout_seconds: 60
  max_retries: 3

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
