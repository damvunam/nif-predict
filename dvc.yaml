stages:
  # Stage 1: Tải & Khởi tạo HMM Profiles (Pfam-A & Nif)
  setup_hmm:
    cmd: python scripts/ml/setup_hmm_profiles.py
    deps:
      - scripts/ml/setup_hmm_profiles.py
      - config/config.yaml
    outs:
      - data/hmm_profiles/Pfam-A.hmm:
          cache: false  # Tải/sinh tự động, không push lên DVC Remote để tiết kiệm storage

  # Stage 2: Chuẩn hóa cấu trúc dữ liệu thô
  standardize_data:
    cmd: python scripts/ml/standardize_data_dir.py
    deps:
      - scripts/ml/standardize_data_dir.py
      - data/raw
    outs:
      - data/interim/annotations

  # Stage 3: Tìm kiếm HMM & Xây dựng Ma trận đặc trưng
  build_features:
    cmd: python scripts/ml/build_feature_matrix.py
    deps:
      - scripts/ml/build_feature_matrix.py
      - data/interim/annotations
      - data/hmm_profiles
    outs:
      - data/processed/feature_matrix.parquet

  # Stage 4: Gán nhãn từ manifest độc lập (EDA là stage riêng trong task sau)
  label_dataset:
    cmd: python scripts/ml/label_dataset.py
    deps:
      - scripts/ml/label_dataset.py
      - nifpredict/ml/labeling/__init__.py
      - nifpredict/ml/labeling/schema.py
      - nifpredict/ml/labeling/validation.py
      - nifpredict/ml/labeling/service.py
      - data/processed/feature_matrix.parquet
      - data/labels/label_manifest.csv
    outs:
      - data/processed/labeled_dataset.parquet
      - data/processed/training_dataset.parquet
    metrics:
      - results/labeling/label_validation_report.json:
          cache: false

  # Stage 5: Dự đoán khả năng cố định đạm (Inference/Evaluation)
  predict:
    cmd: python scripts/ml/predict.py --file data/batch_accessions.txt
    deps:
      - scripts/ml/predict.py
      - data/batch_accessions.txt
    outs:
      - results/bnf_prediction_summary.json
      - results/bnf_prediction_summary.csv
