stages:
  # Stage 1: Tải & Khởi tạo HMM Profiles (Pfam-A & Nif)
  setup_hmm:
    cmd: python scripts/ml/setup_hmm_profiles.py
    deps:
      - scripts/ml/setup_hmm_profiles.py
      - config/config.yaml
    outs:
      - data/hmm_profiles/Pfam-A.hmm:
          cache: false  # Tải/sinh tự động, không push lên DVC Remote để tiết kiệm storage

  # Stage 2: Chuẩn hóa cấu trúc dữ liệu thô
  standardize_data:
    cmd: python scripts/ml/standardize_data_dir.py
    deps:
      - scripts/ml/standardize_data_dir.py
      - data/raw
    outs:
      - data/interim/annotations

  # Stage 3: Tìm kiếm HMM & Xây dựng Ma trận đặc trưng
  build_features:
    cmd: python scripts/ml/build_feature_matrix.py
    deps:
      - scripts/ml/build_feature_matrix.py
      - data/interim/annotations
      - data/hmm_profiles
    outs:
      - data/processed/feature_matrix.parquet

  # Stage 4: Gán nhãn từ manifest độc lập (EDA là stage riêng trong task sau)
  label_dataset:
    cmd: python scripts/ml/label_dataset.py
    deps:
      - scripts/ml/label_dataset.py
      - nifpredict/ml/labeling/__init__.py
      - nifpredict/ml/labeling/schema.py
      - nifpredict/ml/labeling/validation.py
      - nifpredict/ml/labeling/service.py
      - data/processed/feature_matrix.parquet
      - data/labels/label_manifest.csv
    outs:
      - data/processed/labeled_dataset.parquet
      - data/processed/training_dataset.parquet
    metrics:
      - results/labeling/label_validation_report.json:
          cache: false

  # Stage 5: Huấn luyện baseline ML (grouped CV theo family, refit model đã chọn).
  # Chạy sau label_dataset; cần label_manifest.csv có dòng nhãn thật (hiện 0 dòng,
  # label_dataset sẽ lỗi validation rõ ràng, không tạo training set rỗng).
  # --refit-selected lưu model vào models/baseline-v1/ (selected_model.joblib,
  # metadata.json, feature_names.json); MLflow ghi vào mlruns/ (gitignored).
  train:
    cmd: python scripts/ml/train_pipeline.py --run-name baseline-v1 --refit-selected
    deps:
      - scripts/ml/train_pipeline.py
      - nifpredict/ml/workflows/training/service.py
      - nifpredict/ml/workflows/training/artifacts.py
      - nifpredict/ml/workflows/training/refit.py
      - nifpredict/ml/workflows/training/tracking.py
      - nifpredict/ml/evaluation/cross_validation.py
      - nifpredict/ml/models/trainer.py
      - nifpredict/ml/models/metrics.py
      - nifpredict/ml/models/selection.py
      - nifpredict/ml/models/persistence.py
      - data/processed/training_dataset.parquet
    outs:
      - results/training/baseline-v1:
          cache: false
      - models/baseline-v1:
          cache: false
    metrics:
      - results/training/baseline-v1/aggregate_metrics.csv:
          cache: false

  # Stage 6: Dự đoán khả năng cố định đạm (Inference/Evaluation)
  # LƯU Ý: stage này dùng NifPredictor rule-based (HMM 3 gen nifH/D/K, chấm
  # 35+35+30, >=70), KHÔNG dùng model đã train ở stage train. Inference bằng
  # model đã train chưa có script nào; đừng nhầm 2 đường predict này với nhau.
  predict:
    cmd: python scripts/ml/predict.py --file data/batch_accessions.txt
    deps:
      - scripts/ml/predict.py
      - data/batch_accessions.txt
    outs:
      - results/bnf_prediction_summary.json
      - results/bnf_prediction_summary.csv
